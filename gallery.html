<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">

<body>

<header class="topbar">
  <a class="mark" href="index.html">Diwan Alshams</a>
  <nav>
    <a href="index.html#about">About</a>

<main>
  <section class="gallery">
    <h1 class="section-title">Gallery</h1>
    <p class="gallery-intro">Everything else — frames that never made it into a series.</p>
    <div class="gallery-grid" id="gallery-grid"></div>
    <p class="gallery-empty" id="gallery-empty" hidden>
      No photographs yet. Add them to <code>img/gallery/</code> and run
      <code>python3 tools/build-gallery.py</code>.
    </p>
  </section>
</main>

<footer>
  <span>Hamad Alsheail <span class="sep">|</span> Diwan Alshams</span>
  <span class="ar">ديوان الشمس</span>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" tabindex="-1" hidden>
  <button class="lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-prev" type="button" aria-label="Previous image">&#8249;</button>
  <button class="lb-next" type="button" aria-label="Next image">&#8250;</button>
  <figure class="lb-stage">
    <img id="lb-img" src="" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
</div>

<script src="gallery-manifest.js"></script>
<script src="script.js"></script>
<script src="gallery.js"></script>
</body>
